[project]
name = "finance-bro"
version = "0.1.0"
description = "Self-hosted personal-finance tool: pulls Mono transactions, categorizes, reconciles."
readme = "README.md"
authors = [
    { name = "Bohdan Rybak", email = "bohdan.rybak@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.4",
    "apscheduler==3.11.2",
    "fastapi==0.136.1",
    "httpx==0.28.1",
    "iso4217==1.16.20260101",
    "psycopg[binary,pool]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.0.1",
    "sqlalchemy[asyncio]==2.0.49",
    "structlog==25.5.0",
    "tenacity==9.1.4",
    # tzdata: the python:3.13-slim base image ships no /usr/share/zoneinfo, so
    # module-level ZoneInfo("Europe/Kyiv") (main.py, transaction_repo.py) would
    # raise ZoneInfoNotFoundError on first Docker boot. Declare it unconditionally
    # (it was previously lock-only with a win32 marker via psycopg). (Phase 3)
    "tzdata==2026.2",
    "uvicorn[standard]==0.46.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.13"
# Strict mode applies to production code in src/. Tests intentionally use
# pytest fixture parameters whose types pyright can't infer without explicit
# annotations on every fixture; relaxing tests to "standard" keeps strict
# guarantees on the contract surface (Rule 1 deviation — plan-verbatim
# test code is not strict-clean and exhaustive annotation is out of scope
# for this plan).
typeCheckingMode = "strict"
include = ["src"]
ignore = ["tests"]

[dependency-groups]
dev = [
    "anyio==4.13.0",
    "asgi-lifespan==2.1.0",
    "basedpyright==1.39.3",
    "freezegun==1.5.5",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "respx==0.23.1",
    "ruff==0.15.12",
    "testcontainers==4.14.2",
]
